<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важный вопрос</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: #fff;
            transition: background-color 0.5s ease;
        }

        /* Анимация появления для всего текста на сайте */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            transition: opacity 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.7);
        }

        .btn-yes:hover {
            transform: scale(1.05);
        }

        .btn-no {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ccc;
            border: 2px solid #666;
            position: relative;
        }

        /* Каноничная полупрозрачная паутина на всю кнопку */
        .btn-no::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.15) 75%, rgba(255,255,255,0.15)),
                linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.15) 75%, rgba(255,255,255,0.15));
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            pointer-events: none;
            z-index: 1;
        }

        /* Иконка паучка в углу для атмосферы */
        .btn-no::after {
            content: '🕷️';
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 1.2em;
            opacity: 0.6;
            pointer-events: none;
        }

        .btn-no:hover {
            opacity: 0.9;
        }

        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            background-color: #ff6b81;
            width: 20px;
            height: 20px;
            transform: rotate(45deg);
            opacity: 0.7;
            animation: fall linear infinite;
            pointer-events: none;
        }

        .heart::before,
        .heart::after {
            content: '';
            background-color: #ff6b81;
            border-radius: 50%;
            position: absolute;
            width: 20px;
            height: 20px;
        }

        .heart::before {
            top: -10px;
            left: 0;
        }

        .heart::after {
            left: 10px;
            top: 0;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(45deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(110vh) rotate(45deg);
                opacity: 0;
            }
        }

        .success-screen {
            background-color: #ffe5e5;
            color: #ff416c;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .success-screen h1 {
            font-size: 3em;
            text-shadow: none;
            color: #ff416c;
        }

        .fail-screen {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .fail-screen h1 {
            font-size: 2em;
            text-shadow: 0 0 10px #fff;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>

    <div class="container" id="main-screen">
        <h1 class="fade-in-up">Ты будешь моей девушкой?</h1>
        <div class="buttons">
            <button class="btn-yes fade-in-up" id="yesBtn" style="animation-delay: 0.3s;">Да</button>
            <button class="btn-no fade-in-up" id="noBtn" style="animation-delay: 0.6s;">Нет</button>
        </div>
    </div>

    <div class="container success-screen" id="success-screen" style="display: none;">
        <h1 class="fade-in-up">Я знал(а)!</h1>
        <p class="fade-in-up" style="animation-delay: 0.3s;">С Днем святого Валентина ❤️</p>
    </div>

    <div class="container fail-screen" id="fail-screen" style="display: none;">
        <h1 class="fade-in-up">Увы, придется постараться!</h1>
        <p class="fade-in-up" style="animation-delay: 0.3s;">Но сердечки все равно летят...</p>
    </div>

    <script>
        const mainScreen = document.getElementById('main-screen');
        const successScreen = document.getElementById('success-screen');
        const failScreen = document.getElementById('fail-screen');
        const heartsContainer = document.getElementById('hearts');
        const noBtn = document.getElementById('noBtn');

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const startPos = Math.random() * 100;
            heart.style.left = `${startPos}vw`;
            const duration = 5 + Math.random() * 10;
            heart.style.animationDuration = `${duration}s`;
            const size = 10 + Math.random() * 20;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            heart.style.transform = `translateY(-50px) rotate(45deg) scale(${size / 20})`;
            
            heart.addEventListener('animationend', () => {
                heart.remove();
            });

            heartsContainer.appendChild(heart);
        }

        setInterval(createHeart, 500);

        document.getElementById('yesBtn').addEventListener('click', () => {
            document.body.style.backgroundColor = '#ffe5e5';
            mainScreen.style.display = 'none';
            successScreen.style.display = 'flex';
            clearInterval(window.heartInterval);
        });

        // Логика хаотичного прыжка кнопки "Нет"
        noBtn.addEventListener('mouseover', function(e) {
            // Получаем размеры окна
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;
            const btnWidth = this.offsetWidth;
            const btnHeight = this.offsetHeight;

            // Генерируем случайные координаты, следя за тем, чтобы кнопка не ушла за край экрана
            let randomX = Math.random() * (winWidth - btnWidth);
            let randomY = Math.random() * (winHeight - btnHeight);

            // Небольшой отступ от краев
            const padding = 20;
            if (randomX < padding) randomX = padding;
            if (randomY < padding) randomY = padding;
            if (randomX > winWidth - btnWidth - padding) randomX = winWidth - btnWidth - padding;
            if (randomY > winHeight - btnHeight - padding) randomY = winHeight - btnHeight - padding;

            // Прыгаем в новую точку
            this.style.transform = `translate(${randomX - this.getBoundingClientRect().left}px, ${randomY - this.getBoundingClientRect().top}px)`;
            this.style.transition = 'transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55)';

            // Убираем переход через 300 мс, чтобы кнопка была готова к следующему прыжку
            setTimeout(() => {
                this.style.transition = '';
            }, 300);
        });

        noBtn.addEventListener('click', () => {
            document.body.style.backgroundColor = '#000';
            mainScreen.style.display = 'none';
            failScreen.style.display = 'flex';
            clearInterval(window.heartInterval);
        });
    </script>
</body>
</html>
